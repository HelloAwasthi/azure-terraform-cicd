name: "Project 3: OIDC Passwordless CI"

on:
  pull_request:
    branches:
      - main

# CRUCIAL STEP: Grant permission to request the OIDC token from GitHub
permissions:
  id-token: write # Required for requesting the JWT token # this tells github to all the the oidc token which is like a id card for workflow acces to create
  contents: read  # Required for checkout

jobs:
  terraform-ci:
    name: "OIDC Azure CI"
    runs-on: ubuntu-latest
    
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true # Tells Terraform: "Do not look for a client secret!"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: 1. Format Check
        run: terraform fmt -check

      - name: 2. Initialization
        run: terraform init

      - name: 3. Validation
        run: terraform validate

      - name: 4. The Plan
        run: terraform plan -input=false